<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gearbox — Personal Spotify</title>
  <meta name="description" content="Gearbox: A stunning personal Spotify client with glassmorphism UI."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="app">

  <!-- Mobile Hamburger -->
  <button class="hamburger-btn" id="hamburger-btn" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar glass" id="sidebar">
    <div class="sidebar__logo">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="20" fill="url(#logo-grad)"/>
        <path d="M13 26 Q20 15 27 26" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M11 21 Q20 9 29 21" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M9 16 Q20 4 31 16" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40">
            <stop stop-color="#1db954"/><stop offset="1" stop-color="#1565c0"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Gearbox</span>
    </div>

    <!-- Search -->
    <div class="sidebar__search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" class="search-icon">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search tracks, albums, artists…" autocomplete="off"/>
        <button id="search-btn" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Nav -->
    <nav class="sidebar__nav">
      <a class="nav-link active" id="nav-home" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
        </svg>
        Home
      </a>
      <a class="nav-link" id="nav-search" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Search
      </a>
      <a class="nav-link" id="nav-library" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V7h8v2z"/>
        </svg>
        Your Library
      </a>
      <a class="nav-link" id="nav-liked" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        Liked Songs
      </a>
    </nav>

    <div class="sidebar__spacer"></div>

    <!-- Keyboard shortcuts hint -->
    <div class="sidebar__shortcuts glass-subtle">
      <p class="shortcuts-label">Shortcuts</p>
      <div class="shortcut-row"><kbd>Space</kbd> Play/Pause</div>
      <div class="shortcut-row"><kbd>←</kbd><kbd>→</kbd> Prev/Next</div>
      <div class="shortcut-row"><kbd>/</kbd> Search</div>
    </div>

    <!-- User -->
    <div class="sidebar__user glass-subtle">
      <img id="user-avatar" src="assets/placeholder.png" alt="Avatar" class="user-avatar"/>
      <span id="user-name" class="user-name">Loading…</span>
      <button id="nav-ai-key" class="btn-icon" title="Set Anthropic API Key for AI suggestions" style="color:var(--white-60)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        </svg>
      </button>
      <button id="nav-logout" class="btn-icon logout-btn" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Views injected by JS -->
  </main>

  <!-- Now Playing Bar -->
  <div class="np-bar glass" id="np-bar">
    <div class="np-bar__track-info">
      <div class="np-art-wrap" id="np-art-clickable" title="Expand Now Playing">
        <img id="np-img" src="" alt="" class="np-bar__art"/>
        <div class="np-art-eq">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="np-bar__meta">
        <p id="np-title" class="np-bar__title">—</p>
        <p id="np-artist" class="np-bar__artist">—</p>
      </div>
      <button class="heart-btn btn-icon np-heart-btn" id="np-heart-btn" title="Save to Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    </div>

    <div class="np-bar__controls">
      <button id="np-shuffle-btn" class="btn-icon np-ctrl-btn" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>
      <button id="np-prev-btn" class="btn-icon" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/>
        </svg>
      </button>
      <button id="np-play-btn" class="btn-play" title="Play/Pause">
        <span id="np-play-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </span>
      </button>
      <button id="np-next-btn" class="btn-icon" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/>
        </svg>
      </button>
      <button id="np-repeat-btn" class="btn-icon np-ctrl-btn" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>

    <div class="np-bar__progress-wrap">
      <span id="np-time-cur" class="np-time">0:00</span>
      <div class="np-track" id="np-track">
        <div class="np-track__bg">
          <div class="np-track__fill" id="np-progress"></div>
          <div class="np-track__thumb" id="np-thumb"></div>
        </div>
      </div>
      <span id="np-time-dur" class="np-time">0:00</span>
    </div>

    <div class="np-bar__volume">
      <button class="btn-icon" id="np-volume-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <input type="range" id="np-volume" min="0" max="100" value="70" class="volume-slider"/>
    </div>

    <button class="btn-icon np-expand-btn" id="np-expand-btn" title="Expand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
  </div>

</div>

<!-- Fullscreen Now Playing Overlay -->
<div class="fullscreen-np" id="fullscreen-np">
  <div class="fs-np__bg" id="fs-np-bg"></div>
  <button class="btn-icon fs-np__close" id="fs-np-close" title="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="24" height="24">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <div class="fs-np__content">
    <img class="fs-np__img" src="" alt="Album Art"/>
    <div class="fs-np__info">
      <h2 class="fs-np__title">—</h2>
      <p class="fs-np__artist">—</p>
    </div>
    <div class="fs-np__progress">
      <span class="fs-np__time-cur">0:00</span>
      <div class="fs-np__progress-track">
        <div class="fs-np__progress-fill"></div>
      </div>
      <span class="fs-np__time-dur">0:00</span>
    </div>
    <div class="fs-np__controls">
      <button class="btn-icon fs-np__shuffle" id="fs-shuffle-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>
      <button class="btn-icon fs-np__prev" id="fs-prev-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
          <polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/>
        </svg>
      </button>
      <button class="btn-play fs-np__play" id="fs-play-btn">
        <span class="fs-np__play-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </span>
      </button>
      <button class="btn-icon fs-np__next" id="fs-next-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
          <polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/>
        </svg>
      </button>
      <button class="btn-icon fs-np__repeat" id="fs-repeat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
